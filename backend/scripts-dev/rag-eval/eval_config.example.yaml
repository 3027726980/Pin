# ============================================================
# RAG 评估配置模板（复制为 eval_config.yaml 后填写；含 api_key 后勿提交）
# ============================================================

# ── 被测 Agent 的生成 LLM ──
# 优先级：命令行 --model > llm.model_filter > 库中第一条启用配置
llm:
  model_filter: ""                 # 库中 model_name 子串过滤（如 glm / kimi / deepseek）
  auto_create:                     # 库中无匹配配置且 api_key 非空时自动创建
    provider: ""                   # 如 zhipu / moonshot / deepseek / openai ...
    model_name: ""
    base_url: ""
    api_key: ""

# ── 评审 LLM（Ragas 三指标 judge）──
# model_filter 留空 → 回落复用被测 LLM 配置；建议换更强/不同的模型
judge:
  model_filter: ""
  auto_create:
    provider: ""
    model_name: ""
    base_url: ""
    api_key: ""

# ── Embedding（Answer Relevance 的余弦计算用）──
# model_filter 留空 → 库中第一条 model_type=1 配置（本地 bge 零成本）
embedding:
  model_filter: ""
  auto_create:
    provider: ""
    model_name: ""
    base_url: ""
    api_key: ""

# ── 知识库与文档 ──
kb:
  name: RAGEVAL-RAG-TEST
  docs_dir: ../bench/docs          # 测试文档目录（相对本目录），也可自建目录放 .txt
  chunk_size: 800
  chunk_overlap: 150
  chunk_separators: "\n##,\n###,\n,。,., "

# ── 评估 Agent（simple_rag）──
agents:
  simple_rag: "[RAGEVAL] simple_rag"
  top_k: 4
  score_threshold: 0.3

# ── 指标参数 ──
metrics:
  faithfulness:
    max_context_chars: 4000
  answer_relevance:
    num_questions: 3
    temperature: 0.7
  context_relevance:
    max_context_chars: 4000
