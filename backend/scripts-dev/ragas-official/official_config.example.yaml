# ============================================================
# Ragas 官方方法评估配置（ragas-official/ 专用；含 api_key 自动创建则勿提交）
# 三步流程共用：step1 生成测试集 / step2 跑被测 RAG / step3 官方 evaluate
# ============================================================

# ── 生成器/评审 LLM（官方 TestsetGenerator 与 evaluate 共用）──
# 优先级：命令行 --model > llm.model_filter > 库中第一条启用配置
llm:
  model_filter: glm
  auto_create:
    provider: zhipu
    model_name: glm-5.3-flash
    base_url: https://open.bigmodel.cn/api/paas/v4
    api_key: ""

# ── Embedding（官方 KnowledgeGraph transforms + AnswerRelevancy 指标用）──
# api_key 一律从库中 embedding 配置读取（本文件不存密钥）
# backend: dashscope（langchain DashScopeEmbeddings）/ local（本地 bge）/ openai（OpenAI 兼容端点）
embedding:
  backend: dashscope
  model_name: text-embedding-v1
  base_url: ""                     # 仅 openai 后端需要

# ── 被测 RAG 资源（与 rag-eval 同源，保证横向可比）──
kb:
  name: RAGEVAL-RAG-TEST
  docs_dir: ../bench/docs          # 测试集生成的语料来源（官方 KnowledgeGraph 输入）
  chunk_size: 800
  chunk_overlap: 150
  chunk_separators: "\n##,\n###,\n,。,., "

agents:
  simple_rag: "[RAGEVAL] simple_rag"
  top_k: 4
  score_threshold: 0.3

# ── 官方测试集生成 ──
testset:
  size: 10                         # 生成的问答对数量
  # 查询分布默认官方：SingleHop 0.5 / MultiHopAbstract 0.25 / MultiHopSpecific 0.25

# ── 官方评估指标（默认官方 RAG 五指标全集）──
metrics:
  - faithfulness
  - answer_relevancy
  - context_precision
  - context_recall
  - factual_correctness
