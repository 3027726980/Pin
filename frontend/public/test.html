<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pin Widget 嵌入演示</title>
  <style>
    /* 宿主页面故意放一个高对比度样式，验证 Shadow DOM 隔离 */
    body { font-family: 'Courier New', monospace; background: #faf3e6; margin: 0; padding: 24px; }
    .red-test { color: red; font-weight: bold; }
    button { padding: 8px 16px; margin: 4px; cursor: pointer; }
    .demo-block { border: 1px dashed #999; padding: 16px; margin: 16px 0; background: #fff; }
    .demo-block h2 { margin: 0 0 8px; font-size: 16px; }
    iframe { width: 100%; height: 420px; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <h1>Pin Widget 嵌入演示 <span class="red-test">（宿主样式测试：这段是红色的）</span></h1>
  <p>本页通过 Vite dev(8001) 提供，模拟第三方宿主页面；API 经 /api 代理到后端(8000)，Origin 不同 → 跨域链路。</p>

  <div class="demo-block">
    <h2>① 浮窗模式（float，右下角悬浮球）</h2>
    <p>请先在下方填入 Agent ID 和 API Key（Agent 编辑页「嵌入设置」生成），然后点击加载。</p>
    <input id="agentId" placeholder="Agent ID (uuid)" style="width:320px">
    <input id="apiKey" placeholder="API Key (pin_xxx)" style="width:280px">
    <button onclick="loadWidget('float')">加载浮窗</button>
    <button onclick="loadWidget('mobile')">加载移动端模式</button>
    <button onclick="loadWidget('fullscreen')">加载全屏(iframe)</button>
  </div>

  <div class="demo-block">
    <h2>② 全屏 iframe 区域（loadWidget('fullscreen') 后出现）</h2>
    <div id="fullscreenHost"></div>
  </div>

  <script>
    function loadWidget(mode) {
      const agentId = document.getElementById('agentId').value.trim()
      const apiKey = document.getElementById('apiKey').value.trim()
      if (!agentId || !apiKey) { alert('请先填入 Agent ID 和 API Key'); return }

      if (mode === 'fullscreen') {
        document.getElementById('fullscreenHost').innerHTML = ''
        // 方案一：直接 iframe 全屏页（零 JS 依赖）
        const frame = document.createElement('iframe')
        frame.src = '/chat/embed/' + agentId + '?api_key=' + apiKey
        document.getElementById('fullscreenHost').appendChild(frame)
        return
      }

      // 方案二：widget.js 脚本（浮窗 / 移动端）
      const script = document.createElement('script')
      script.src = 'http://localhost:8000/widget/widget.js'
      script.onload = () => {
        window.PinWidget.init({
          agentId,
          apiKey,
          mode,
          theme: { primaryColor: '#2080f0', title: '演示助手', logo: '' },
        })
      }
      script.onerror = () => alert('widget.js 加载失败，请确认后端已启动 (http://localhost:8000)')
      document.body.appendChild(script)
    }
  </script>
</body>
</html>
